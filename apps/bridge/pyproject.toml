[project]
name = "gtm-bridge"
version = "0.1.0"
description = "GTM-OS local bridge: keeps a user's LinkedIn session on their own machine and dials out to the control plane"
requires-python = ">=3.12,<3.15"
dependencies = [
    "gtmos-schemas",
    "mcp>=1.9",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "rich>=13.0",
    # The upstream LinkedIn MCP server, used as a published dependency rather
    # than forked. See docs/BRIDGE.md for why.
    "mcp-server-linkedin>=4.23.1",
]

[project.scripts]
gtm-bridge = "gtmos_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtmos_bridge"]
