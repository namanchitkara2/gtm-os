[project]
name = "gtmos-control"
version = "0.1.0"
description = "GTM-OS control plane: remote MCP server, bridge tunnel, run orchestration"
requires-python = ">=3.12,<3.15"
dependencies = [
    "gtmos-schemas",
    "gtmos-graphs",
    "gtmos-providers",
    "fastmcp>=3.4.4",
    "uvicorn>=0.30",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "httpx>=0.27",
    "websockets>=13.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtmos_control"]
