[project]
name = "gtmos-graphs"
version = "0.1.0"
description = "GTM methodology encoded as graph logic: account tiering, ICP fit scoring, sequence structure"
requires-python = ">=3.12,<3.15"
dependencies = ["gtmos-schemas", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtmos_graphs"]
