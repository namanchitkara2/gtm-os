[project]
name = "gtmos-providers"
version = "0.1.0"
description = "Cache-first, cost-aware enrichment routing: the cheapest source that clears the confidence bar, and a ledger of every attempt"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.9", "gtmos-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtmos_providers"]
