[project]
name = "gtmos-schemas"
version = "0.1.0"
description = "Shared typed models for GTM-OS: people, companies, targets, runs, evidence, bridge protocol"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtmos_schemas"]
