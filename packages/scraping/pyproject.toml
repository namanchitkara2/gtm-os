[project]
name = "gtmos-scraping"
version = "0.1.0"
description = "Shared scraping infrastructure: SSRF-guarded fetch, domain policy, extraction, evidence"
requires-python = ">=3.12,<3.15"
dependencies = ["gtmos-schemas", "pydantic>=2.9", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtmos_scraping"]
